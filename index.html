<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="darkreader-lock">
<link rel="icon" href="data:,">
<title>Unrequited Colors</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- LEFT -->
    <div id="controls">

        <h1>Unrequited Colors</h1>
        <div class="hints">
            <p class="hint">
                <b>Instructions</b><br>
                Select an image<br>
                Pick a palette<br>
                Tweak temperature slider<br><br>
                More on the <a href=github.com/UnrequitedEcho/Unrequited-Colors>Github Repo</a>
            </p>
            <p class="hint">
                <b>Palette controls</b><br>
                Left click: edit color<br>
                Middle click: disable color<br>
                Right click: remove color<br>
            </p>
        </div>
        <!-- File buttons -->
        <div class="button-row">
            <button id="openImage">Open Image</button>
            <button id="saveImage">Save Image</button>
            <button id="resetView">Reset View</button>
        </div>

        <hr>

        <!-- Controls -->
        <div id="effects">
            <div class="sectionHeader">
                <h2>Effects</h2>

                <label class="switch">
                    <input type="checkbox" id="showProcessed" checked>
                    <span class="switch-slider"></span>
                </label>
            </div>
            <div id="shaderControls"></div>
        </div>

        <hr>

        <!-- Palette -->
        <h2>Palette</h2>
        <div id="palette"></div>

    </div>

    <!-- RIGHT -->
    <div id="preview">
        <canvas id="canvas"></canvas>
    </div>

    <input id="imageInput" type="file" accept="image/*" style="display:none;">
    <script type="module" src="main.js"></script> 

</body>
</html>
